<!doctype html>
<!--
  Map Website - the one page both features share.

  This file owns the map. Feature branches do not edit the map set-up here;
  they add a <script> for their own folder and call view.addLayer(...).
  See shared/README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Website</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --sidebar-width: 320px; --accent: #2b6cb0; --border: #e2e2e2; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #fff; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: var(--sidebar-width); }

  #sidebar {
    position: absolute; top: 0; bottom: 0; right: 0; width: var(--sidebar-width);
    display: flex; flex-direction: column; background: #fff;
    border-left: 1px solid var(--border); box-sizing: border-box;
  }
  .sidebar-tabs { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .sidebar-tab {
    flex: 1; padding: 10px 12px; font: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 8px; background: #fff;
    color: #333; cursor: pointer;
  }
  .sidebar-tab:hover { background: #f5f5f5; }
  .sidebar-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sidebar-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sidebar-panel { flex: 1; overflow-y: auto; padding: 16px; font-size: 14px; line-height: 1.5; }
  .sidebar-panel h2 { margin: 0 0 8px; font-size: 16px; }
  .sidebar-placeholder { color: #666; margin: 0; }

  /* Phones: map on top, sidebar underneath. */
  @media (max-width: 640px) {
    #map { right: 0; bottom: 45%; }
    #sidebar { top: 55%; width: auto; left: 0; border-left: 0; border-top: 1px solid var(--border); }
  }

  #legend {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: #fff; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; line-height: 1.6;
  }
  .legend-swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 6px;
  }
  .legend-count { color: #666; }
  .legend-row.is-hidden { opacity: .4; }
  .legend-empty { color: #666; }
</style>
</head>
<body>

<div id="map"></div>
<div id="legend"></div>

<!--
  One tab per feature. Each feature fills its own panel from its own folder
  via sidebar.panel('restaurants') / sidebar.panel('routes'), so neither
  branch edits this markup. The placeholder text is replaced when it does.
-->
<aside id="sidebar">
  <div class="sidebar-tabs" role="tablist" aria-label="Features">
    <button class="sidebar-tab" role="tab" id="tab-restaurants"
            data-panel="restaurants" aria-controls="panel-restaurants">Restaurants</button>
    <button class="sidebar-tab" role="tab" id="tab-routes"
            data-panel="routes" aria-controls="panel-routes">Routes</button>
  </div>
  <section class="sidebar-panel" id="panel-restaurants" role="tabpanel"
           aria-labelledby="tab-restaurants">
    <h2>Restaurants</h2>
    <p class="sidebar-placeholder">Restaurant search and filters go here.</p>
  </section>
  <section class="sidebar-panel" id="panel-routes" role="tabpanel"
           aria-labelledby="tab-routes" hidden>
    <h2>Routes</h2>
    <p class="sidebar-placeholder">Route generator controls go here.</p>
  </section>
</aside>

<!-- The shared base map and sidebar. Always first. -->
<script src="./map.js"></script>
<script src="./sidebar.js"></script>

<!--
  Demo fixture: a snapshot of Boston OSM data from spikes/spike.py, so the page
  shows something real before either feature exists. Delete this line and the
  demo block below once restaurants/ and routes/ load their own data.
-->
<script src="./sample-data.js"></script>

<script>
  // One map for the whole site. Both features add layers to this object.
  window.view = MapWebsite.createMap({ container: 'map' });

  // One sidebar, one tab per feature. Features fill sidebar.panel('<name>').
  window.sidebar = MapWebsite.createSidebar({ container: 'sidebar' });
</script>

<!--
  Feature layers. Each file lives in its own folder and owns its own namespace,
  so neither branch has to edit this file again - which is what keeps the two
  branches from conflicting. Order here only sets which runs first; draw order
  on the map is decided by layer type in map.js.
-->
<script src="../routes/layers.js"></script>
<script src="../restaurants/layers.js"></script>

<script>
  // ---- demo block: remove once the real features load their own data ----
  const asPoints = (items) => ({
    type: 'FeatureCollection',
    features: items.map((p) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
      properties: { name: p.name, sub: p.sub }
    }))
  });

  const popup = (props) =>
    '<b>' + props.name + '</b>' + (props.sub ? '<br>' + props.sub : '');

  // Restaurants now load their own data (restaurants/layers.js).

  view.addLayer({
    id: 'routes:sample-bathrooms',
    type: 'circle',
    data: asPoints(SAMPLE_DATA.bathrooms),
    paint: {
      'circle-radius': 7,
      'circle-color': '#2f855a',
      'circle-stroke-width': 1,
      'circle-stroke-color': '#fff'
    },
    legend: { label: 'Public toilets', color: '#2f855a' },
    popup: popup
  });

  view.ready((v, map) => {
    new maplibregl.Marker({ color: '#000' })
      .setLngLat(SAMPLE_DATA.start)
      .addTo(map);
  });
  // ---- end demo block ----
</script>

</body>
</html>
